<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="在线报名深耕文学创作班或扎根文学鉴赏班。">
  <meta name="zuoxie-api-base" content="">
  <title>课程报名 | 马来西亚华文作家协会</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./site.css?v=20260917-1">
</head>
<body><header class="site-header" id="top" data-site-header></header>
<main class="application-page"><section class="application-shell">
  <div class="application-intro"><p class="eyebrow">Course Registration</p><h1>课程报名</h1><p>直接在官网提交深耕文学创作班或扎根文学鉴赏班的报名资料。提交后，协会将根据当期课程名额与条件联系您。</p><div class="application-note"><b>请注意</b><p>报名不代表录取。开课日期、费用、导师与课程安排以协会最终确认通知为准。</p></div></div>
  <form class="public-application-form" data-public-form data-endpoint="/course-registrations">
    <label>选择课程 *<select name="programme" required><option value="深耕文学创作班">深耕文学创作班</option><option value="扎根文学鉴赏班">扎根文学鉴赏班</option></select></label>
    <div class="form-two"><label>姓名 *<input name="name" autocomplete="name" maxlength="120" required></label><label>职业／身份<input name="occupation" maxlength="120" placeholder="例如：教师、学生、自由工作者"></label></div>
    <div class="form-two"><label>Email *<input name="email" type="email" autocomplete="email" maxlength="190" required></label><label>联系电话 *<input name="phone" type="tel" autocomplete="tel" maxlength="40" required></label></div>
    <label>相关写作、阅读或教学经验<textarea name="experience" maxlength="2000" rows="5"></textarea></label>
    <label>希望从课程中获得什么？<textarea name="expectations" maxlength="2000" rows="5"></textarea></label>
    <label class="honeypot" aria-hidden="true">网站<input name="website" tabindex="-1" autocomplete="off"></label>
    <label class="consent-check"><input name="consent" type="checkbox" value="1" required><span>我同意协会为处理本次课程报名而使用以上资料，并已阅读<a href="legal.html" target="_blank">隐私政策</a>。</span></label>
    <button class="button dark" type="submit">提交课程报名</button><p class="form-status" data-form-status aria-live="polite"></p>
  </form>
</section></main><footer class="site-footer" data-site-footer></footer>
<script src="./site-shell.js?v=20260917-1"></script><script src="./site-api.js?v=20260917-1"></script><script src="./site.js?v=20260824-4"></script></body></html>
