<body><header class="site-header" id="top" data-site-header></header><main class="content-hub-page"><section class="content-hub-shell"><div class="content-hub-hero"><div><p class="eyebrow">Writer Columns</p><h1>作家专栏</h1></div><p>“写书人”保存作者资料，“作家专栏”呈现作者持续发表的文章。两者双向连接，让读者能从文章认识作者，也能从作者档案找到其专栏作品。</p></div><div class="hub-card-grid"><a class="hub-card" href="writer-council.html"><span>Council</span><h2>理事文章</h2><p>汇集现任理事的文学观点、协会观察与文化议题。</p><b>浏览文章 →</b></a><a class="hub-card" href="writer-members.html"><span>Members</span><h2>会员文章</h2><p>保存会员创作、评论、阅读札记与地方书写。</p><b>浏览文章 →</b></a><a class="hub-card" href="writer-young.html"><span>Young Writers</span><h2>青年作家</h2><p>为新人作品、文学奖入选作品与成长记录建立入口。</p><b>浏览文章 →</b></a></div><div class="column-note"><b>联动方式：</b>每张文章卡片都显示作者并连接“写书人档案”；作者档案页则自动列出该作者的专栏文章和所属栏目。</div></section></main><footer class="site-footer" data-site-footer></footer><script src="./site-shell.js?v=20260802-8"></script><script src="./site.js?v=20260802-12"></script></body></html>
