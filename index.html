  <header class="site-header" id="top" data-site-header></header>

    <section class="hero-section snap-section home-hero" id="home">
      <div class="hero-dust" aria-hidden="true"></div>
      <div class="hero-copy">
        <p class="eyebrow">Malaysia Chinese Writers Association</p>
        <h1>马华文学<br>在此生长</h1>
        <p>从作家、作品、课程、活动现场到历史档案，作协以文字保存时代回声，也让马华文学继续向新的读者生长。</p>
      </div>
      <div class="hua-stage" aria-label="由繁体華字偏旁部首拼合的数字展馆动画">
        <div class="hud-lines" aria-hidden="true"></div>
        <button class="hua-glyph" type="button" aria-label="重新拼合繁体華字">
          <span class="hua-piece p1">華</span>
          <span class="hua-piece p2">華</span>
          <span class="hua-piece p3">華</span>
          <span class="hua-piece p4">華</span>
          <span class="hua-piece p5">華</span>
          <span class="hua-piece p6">華</span>
          <span class="hua-piece p7">華</span>
          <span class="hua-piece p8">華</span>
          <span class="hua-piece p9">華</span>
        </button>
        <p class="hero-vertical">口述历史、典藏记忆<br>连接过去，启迪未来</p>
      </div>
    </section>
